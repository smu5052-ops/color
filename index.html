<title>캐릭터 색깔 고르기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
/* Layout concept: a dark arcade screen on a quiet page. One huge Korean word is the whole game; four color keys sit under it. */
:root {
  --bg: #f3f2f8;
  --fg: #1a1923;
  --muted: #686679;
  --line: #dad8e5;
  --chip: #ffffff;
  --stage: #17151f;
  --stage-fg: #f3f2f8;
  --stage-muted: #a19fb3;
  --stage-veil: rgba(23, 21, 31, 0.95);

  --red: #ef4444;
  --purple: #9b5de5;
  --sky: #4cc9f0;
  --pink: #ff7eb9;
  --on-red: #ffffff;
  --on-purple: #ffffff;
  --on-sky: #0c2a36;
  --on-pink: #3a0f26;
  --good: #3ddc84;
  --bad: #ff6b6b;

  --font-display: 'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0e15;
    --fg: #efeef6;
    --muted: #9d9baf;
    --line: #2b2938;
    --chip: #181722;
    --stage: #1d1b29;
    --stage-veil: rgba(29, 27, 41, 0.95);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0e15;
  --fg: #efeef6;
  --muted: #9d9baf;
  --line: #2b2938;
  --chip: #181722;
  --stage: #1d1b29;
  --stage-veil: rgba(29, 27, 41, 0.95);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 7vw, 38px); line-height: 1.15; margin: 0; text-wrap: balance; }
.lede { margin: 6px 0 0; color: var(--muted); max-width: 52ch; }

/* legend */
.legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.chip { display: flex; align-items: center; gap: 10px; background: var(--chip); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; min-width: 0; }
.chip img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex: none; }
.chip .nm { font-weight: 700; line-height: 1.2; }
.chip .cl { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.chip .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.chip > div { min-width: 0; }

/* stage */
.stage { position: relative; background: var(--stage); color: var(--stage-fg); border-radius: 22px; padding: 18px 18px 22px; overflow: hidden; }
.hud { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { display: flex; flex-direction: column; }
.stat .k { font-size: 12px; letter-spacing: 0.06em; color: var(--stage-muted); }
.stat .v { font-family: var(--font-display); font-size: 26px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.1); margin-top: 12px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 100%; background: var(--sky); border-radius: 99px; transition: background 0.2s; }
.bar > i.low { background: var(--bad); }
.field { min-height: 250px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; padding-top: 10px; }
.prompt { color: var(--stage-muted); font-size: 15px; }
.word { font-family: var(--font-display); font-size: clamp(68px, 20vw, 128px); line-height: 1.1; min-height: 1.1em; word-break: keep-all; }
.word.pop { animation: pop 0.14s ease-out; }
.fb { min-height: 42px; display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--stage-muted); }
.fb img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
.fb .tag { font-weight: 700; }
.fb.ok .tag { color: var(--good); }
.fb.bad .tag { color: var(--bad); }
.stage.shake { animation: shake 0.28s linear; }
.overlay { position: absolute; inset: 0; background: var(--stage-veil); display: grid; place-items: center; padding: 24px; text-align: center; }
.overlay[hidden] { display: none; }
.overlay .box { max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.overlay h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 7vw, 36px); line-height: 1.2; margin: 0; text-wrap: balance; }
.overlay p { margin: 0; color: var(--stage-muted); }
.overlay .big { font-family: var(--font-display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.go { font: inherit; font-weight: 700; font-size: 18px; border: 0; border-radius: 14px; padding: 12px 30px; margin-top: 4px; cursor: pointer; background: var(--stage-fg); color: var(--stage); }
.go:hover { filter: brightness(0.92); }

/* answers */
.answers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.key { position: relative; font: inherit; font-weight: 700; font-size: 19px; aspect-ratio: 1 / 1; padding: 0; overflow: hidden; background: var(--stage); border: 3px solid var(--stage-muted); border-radius: 16px; cursor: pointer; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); transition: transform 0.06s, filter 0.15s, opacity 0.2s; }
.key:hover:not(:disabled) { filter: brightness(1.07); }
.key:active:not(:disabled) { transform: translateY(2px) scale(0.98); }
.key:disabled { opacity: 0.45; cursor: default; }
.key .n { position: absolute; z-index: 2; top: 8px; left: 8px; min-width: 22px; height: 22px; display: grid; place-items: center; border-radius: 7px; background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; }
.key .nm { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 26px 6px 10px; text-align: center; color: #fff; font-family: var(--font-display); font-weight: 400; font-size: 21px; line-height: 1.1; background: linear-gradient(to top, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0)); }
.key img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.key.hit { outline: 4px solid var(--good); outline-offset: 2px; }
.go:focus-visible, .key:focus-visible, .tool:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.stage .go:focus-visible { outline-color: var(--stage-fg); }

.foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
.tool { font: inherit; font-size: 14px; color: var(--fg); background: var(--chip); border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; cursor: pointer; }

@keyframes pop { from { transform: scale(0.92); opacity: 0.6; } to { transform: scale(1); opacity: 1; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
@media (prefers-reduced-motion: reduce) {
  .word.pop, .stage.shake { animation: none; }
  .key, .bar > i { transition: none; }
}
@media (max-width: 560px) {
  .legend { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .answers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .key .nm { font-size: 18px; }
  .hud .v { font-size: 22px; }
}
</style>

<div class="wrap">
  <header>
    <h1>캐릭터 색깔 고르기</h1>
    <p class="lede">가운데에 캐릭터 이름이 어떤 색으로 나와요. 이름은 무시하고, 글자에 칠해진 색을 가진 캐릭터를 아래에서 고르면 정답이에요.</p>
  </header>

  <section class="legend" id="legend" aria-label="캐릭터와 색깔"></section>

  <section class="stage" id="stage">
    <div class="hud">
      <div class="stat"><span class="k">점수</span><span class="v" id="score">0</span></div>
      <div class="stat"><span class="k">연속</span><span class="v" id="streak">0</span></div>
      <div class="stat"><span class="k">최고</span><span class="v" id="best">0</span></div>
      <div class="stat"><span class="k">남은 시간</span><span class="v" id="time">30.0</span></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="field">
      <div class="prompt">이 글자 색의 캐릭터는?</div>
      <div class="word" id="word">&nbsp;</div>
      <div class="fb" id="fb"></div>
    </div>
    <div class="overlay" id="overlay">
      <div class="box" id="overlayBox"></div>
    </div>
  </section>

  <div class="answers" id="answers">
    <button class="key" data-i="0" aria-label="카구야" disabled><span class="n">1</span><span class="nm">카구야</span></button>
    <button class="key" data-i="1" aria-label="이로하" disabled><span class="n">2</span><span class="nm">이로하</span></button>
    <button class="key" data-i="2" aria-label="야치요" disabled><span class="n">3</span><span class="nm">야치요</span></button>
    <button class="key" data-i="3" aria-label="노이" disabled><span class="n">4</span><span class="nm">노이</span></button>
  </div>

  <div class="foot">
    <span>키보드 1~4 번으로도 고를 수 있어요. 틀리면 3초가 줄어요.</span>
    <button class="tool" id="hintBtn" type="button" aria-pressed="false">힌트 보기</button>
  </div>
</div>

    box.innerHTML =
      '<h2>이름 말고 색을 보세요</h2>' +
      '<p>캐릭터 이름이 어떤 색으로 나오면, 이름은 무시하고, 글자 색의 주인인 캐릭터 버튼을 누르세요. 30초 동안 몇 개나 맞힐 수 있는지 도전해 보세요.</p>' +
      '<button class="go" id="goBtn" type="button">시작</button>';
    overlay.hidden = false;
    $('goBtn').addEventListener('click', start);
  }

  function flashHit(idx) {
    var k = keys[idx];
    k.classList.add('hit');
    setTimeout(function () { k.classList.remove('hit'); }, 450);
  }

  function pick(idx) {
    if (state !== 'playing') return;
    var ch = CH[cur.ink], wd = CH[cur.w], ok = idx === cur.ink;
    total++;
    if (ok) {
      score++; streak++;
      if (streak > maxStreak) maxStreak = streak;
    } else {
      streak = 0;
      deadline -= PENALTY;
      flashHit(cur.ink);
      stage.classList.remove('shake');
      void stage.offsetWidth;
      stage.classList.add('shake');
    }
    fbEl.className = 'fb ' + (ok ? 'ok' : 'bad');
    fbEl.innerHTML = '<img src="' + (IMGS[ch.key] || '') + '" alt=""><span><span class="tag">' + (ok ? '정답' : '오답') + '</span> ' + wd.name + ' 글자는 ' + ch.label + ', 곧 ' + ch.name + '의 색</span>';
    renderHud();
    if (performance.now() >= deadline) { end(); return; }
    nextRound();
  }

  keys.forEach(function (k) {
    k.addEventListener('click', function () { pick(parseInt(k.getAttribute('data-i'), 10)); });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key >= '1' && e.key <= '4') {
      if (state === 'playing') { e.preventDefault(); pick(parseInt(e.key, 10) - 1); }
    } else if (e.key === 'Enter' && state !== 'playing') {
      var a = document.activeElement;
      if (!a || a.tagName !== 'BUTTON') { e.preventDefault(); start(); }
    }
  });

  hintBtn.addEventListener('click', function () {
    hint = !hint;
    hintBtn.setAttribute('aria-pressed', hint ? 'true' : 'false');
    hintBtn.textContent = hint ? '힌트 숨기기' : '힌트 보기';
    showLegend();
  });

  wordEl.textContent = CH[0].name;
  wordEl.style.color = 'var(--' + CH[3].c + ')';
  showIdle();
  showLegend();
})();
</script>
